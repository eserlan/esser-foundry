name: Manual Release (legacy)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.3). If empty, reads from esser/system.json."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zip

      - name: Resolve version
        id: vars
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(jq -r .version esser/system.json)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release zip
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          ZIP="esser-v${VERSION}.zip"
          rm -f "$ZIP"
          zip -r "$ZIP" esser

      - name: Create GitHub Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.vars.outputs.version }}
          name: v${{ steps.vars.outputs.version }}
          generate_release_notes: true
          files: esser-v${{ steps.vars.outputs.version }}.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
