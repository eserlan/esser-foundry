name: Publish system.json and Release

env:
  SYSTEM_JSON: esser/system.json
  PAGES_DIR: pages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit version (e.g. 1.2.3). If empty, auto-bump."
        required: false
        default: ""
      bump:
        description: "Auto-bump segment when version is empty."
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish-and-release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use our own auth for push to avoid user-scoped creds
          persist-credentials: false

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zip

      - name: Compute version and update system.json
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          FILE="$SYSTEM_JSON"
          CURR=$(jq -r .version "$FILE")

          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            IFS='.' read -r MA MI PA <<< "$CURR"
            case "${{ github.event.inputs.bump }}" in
              major) MA=$((MA+1)); MI=0; PA=0 ;;
              minor) MI=$((MI+1)); PA=0 ;;
              *)     PA=$((PA+1)) ;;
            esac
            VERSION="${MA}.${MI}.${PA}"
          fi

          DL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/esser-v${VERSION}.zip"

          tmp="$(mktemp)"
          jq --arg v "$VERSION" --arg dl "$DL" '.version=$v | .download=$dl' "$FILE" > "$tmp"
          mv "$tmp" "$FILE"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $SYSTEM_JSON
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): bump to v${{ steps.ver.outputs.version }} and update download url"
            # push with explicit token-authenticated URL to avoid permission issues
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}" "HEAD:${BRANCH_NAME}"
          else
            echo "No changes to commit"
          fi

      - name: Prepare Pages content
        run: |
          set -e
          mkdir -p "$PAGES_DIR" "$PAGES_DIR/esser"
          cp "$SYSTEM_JSON" "$PAGES_DIR/system.json"
          cp "$SYSTEM_JSON" "$PAGES_DIR/esser/system.json"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PAGES_DIR }}

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Build release
        run: |
          set -e
          VERSION="${{ steps.ver.outputs.version }}"
          ZIP="esser-v${VERSION}.zip"
          rm -f "$ZIP"
          zip -r "$ZIP" esser

      - name: Create GitHub Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: esser-v${{ steps.ver.outputs.version }}.zip
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
