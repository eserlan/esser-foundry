name: Publish system.json to Pages and trigger Release

env:
  SYSTEM_JSON: esser/system.json
  PAGES_DIR: pages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit version (e.g. 1.2.3). If empty, auto-bump."
        required: false
        default: ""
      bump:
        description: "Auto-bump segment when version is empty."
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish-and-tag:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    env:
      GH_RELEASE_PAT: ${{ secrets.GH_RELEASE_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use default GITHUB_TOKEN for branch pushes
          persist-credentials: true

      - name: Ensure git auth for branch push (use GITHUB_TOKEN)
        run: |
          echo "Current git remotes:" && git remote -v
          if ! git remote -v | grep -q 'x-access-token'; then
            echo "Configuring origin to use GITHUB_TOKEN for branch pushes"
            git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          fi
          echo "Updated git remotes:" && git remote -v

      - name: Note about PAT
        if: ${{ env.GH_RELEASE_PAT == '' }}
        run: |
          echo "WARNING: GH_RELEASE_PAT secret not set. Tag pushes from GITHUB_TOKEN will NOT trigger release.yml."

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Compute version and update system.json
        id: ver
        shell: bash
        run: |
          FILE="$SYSTEM_JSON"
          CURR=$(jq -r .version "$FILE")

          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            IFS='.' read -r MA MI PA <<< "$CURR"
            case "${{ github.event.inputs.bump }}" in
              major) MA=$((MA+1)); MI=0; PA=0 ;;
              minor) MI=$((MI+1)); PA=0 ;;
              *)     PA=$((PA+1)) ;;
            esac
            VERSION="${MA}.${MI}.${PA}"
          fi

          DL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/esser-v${VERSION}.zip"

          tmp="$(mktemp)"
          jq --arg v "$VERSION" --arg dl "$DL" '.version=$v | .download=$dl' "$FILE" > "$tmp"
          mv "$tmp" "$FILE"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $SYSTEM_JSON
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): bump to v${{ steps.ver.outputs.version }} and update download url"
            git push origin "HEAD:${BRANCH_NAME}"
          fi

      - name: Prepare Pages content
        run: |
          mkdir -p "$PAGES_DIR" "$PAGES_DIR/esser"
          cp "$SYSTEM_JSON" "$PAGES_DIR/system.json"
          cp "$SYSTEM_JSON" "$PAGES_DIR/esser/system.json"

      - name: Verify Pages content
        run: |
          echo "Listing $PAGES_DIR" && ls -la "$PAGES_DIR"
          echo "Listing $PAGES_DIR/esser" && ls -la "$PAGES_DIR/esser"
          echo "system.json preview (root):" && head -n 10 "$PAGES_DIR/system.json"
          echo "system.json preview (esser/):" && head -n 10 "$PAGES_DIR/esser/system.json"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PAGES_DIR }}

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Reconfigure git auth for tag push (use PAT)
        if: ${{ env.GH_RELEASE_PAT != '' }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_RELEASE_PAT}@github.com/${{ github.repository }}.git"
          git remote -v

      - name: Create and push tag to trigger Release
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"; exit 1
          fi
          git tag "$TAG"
          git push origin "$TAG"
